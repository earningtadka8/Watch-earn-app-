<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BestDeals - Fashion & Beauty</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://libtl.com/sdk.js" data-zone="11968926" data-sdk="show_11968926"></script>
<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial;padding:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:#0f0f12;z-index:10}
.tab{background:#1e1e1e;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:#ffcc00;color:#000;font-weight:bold}
.info{background:#1f1f3a;border:1px solid #6c5cff;border-radius:10px;padding:10px;font-size:12px;text-align:center;margin-bottom:10px}
.wheel{width:220px;height:220px;border-radius:50%;margin:15px auto;position:relative;border:4px solid #6c5cff;background:conic-gradient(#6a4cff 0 70%, #333 70% 98%, #3b82f6 98% 99%, #22c55e 99% 99.5%, #06b6d4 99.5% 100%);transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:#000;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.pin{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #ffcc00;margin:0 auto}
.btn{width:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.prod{background:#1e1e1e;border-radius:12px;padding:8px;border:1px solid #333}
.prod img{width:100%;height:130px;object-fit:cover;border-radius:8px}
.prod h4{font-size:11px;margin:5px 0;height:30px;overflow:hidden}
.price{color:#00ff88;font-weight:bold;font-size:13px}
.old{color:#777;font-size:10px;text-decoration:line-through;margin-left:4px}
.discTag{font-size:8px;background:#003d1f;padding:4px;border-radius:4px;display:block;margin-top:4px;color:#00ff88;text-align:center;border:1px dashed #00ff88}
.buy{background:#fff;color:#000;border:0;width:100%;padding:6px;border-radius:6px;font-size:11px;font-weight:bold;margin-top:5px}
.loader{text-align:center;padding:20px;color:#666;font-size:12px}
</style>
</head>
<body>

<h2 style="text-align:center">BestDeals Store</h2>
<div class="info">Products ≤ ₹1000 • Max ₹5 Discount<br>Auto Discount + Spin Extra</div>
<div class="pin"></div>
<div style="position:relative"><div class="wheel" id="wheel"><div class="center">SPIN</div></div></div>
<button class="btn" id="spinBtn" onclick="startSpin()">✨ Spin and Get More Discount</button>
<div id="result" style="text-align:center;font-size:13px;margin:8px 0;min-height:18px"></div>

<div class="tabs">
  <div class="tab active" onclick="filterCat('all', this)">All</div>
  <div class="tab" onclick="filterCat('mens', this)">Mens Wear</div>
  <div class="tab" onclick="filterCat('womens', this)">Womens Wear</div>
  <div class="tab" onclick="filterCat('makeup', this)">Makeup</div>
</div>

<div id="productContainer"></div>
<div class="loader" id="loader">↓ Niche scroll karo aur products load honge...</div>

<script>
// ===================== YAHAN IDS LAGENGE =====================
// 1. YAHAN CUELINK ID LAGEGI - BAAD ME LAGA DENA
const CUELINK_PUBLISHER_ID = "YAHAN_CUELINK_ID_LAGEGI_BAAD_ME"; // <-- YAHAN CUELINK ID AYEGI
const USE_CUELINK = false; // ID milte hi true kar dena

// 2. AMAZON AUTO TAG - TERA TAG LAGA DIYA HAI, HAMESHA RAHEGA
const MY_AMAZON_TAG = "earningtadka8-21"; // <-- TERA FINAL TAG
const MY_FLIPKART_AFFID = "bestdealsaff";
// ============================================================

let AdsBlock = window.Adsgram? window.Adsgram.init({blockId:"int-52779"}) : null;
let isSpinning=false, lastAd="adsgram", spinExtra=0, visibleCount=8, currentFilter='all';

let allProducts=[
 {name:"Men Black Cotton T-Shirt", price:299, old:799, myCommission:3, cat:"mens", platform:"amazon", img:"https://m.media-amazon.com/images/I/61bDoqhvEPL._SY879_.jpg", link:"https://www.amazon.in/dp/B0XXXX001"},
 {name:"Men Denim Jeans Slim Fit", price:799, old:1999, myCommission:10, cat:"mens", platform:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/jean/n/q/h/-original-imaghz9qng3xuhha.jpeg", link:"https://www.flipkart.com/mens-jeans/p/itm001"},
 {name:"Men Casual Shirt Blue", price:549, old:1299, myCommission:10, cat:"mens", platform:"amazon", img:"https://m.media-amazon.com/images/I/71e+4uY6+ZL._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX002"},
 {name:"Men Sports Shoes Running", price:899, old:2499, myCommission:10, cat:"mens", platform:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/shoe/7/r/5/-original-imaggcb4chjkhpge.jpeg", link:"https://www.flipkart.com/mens-shoes/p/itm002"},
 {name:"Men Leather Wallet", price:349, old:799, myCommission:3, cat:"mens", platform:"amazon", img:"https://m.media-amazon.com/images/I/71OZY9QKLWL._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX003"},
 {name:"Men Winter Hoodie", price:699, old:1499, myCommission:10, cat:"mens", platform:"amazon", img:"https://m.media-amazon.com/images/I/61QJceQv0jL._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX004"},
 {name:"Women Pink Cotton Kurta", price:499, old:1299, myCommission:10, cat:"womens", platform:"amazon", img:"https://m.media-amazon.com/images/I/61I4Q+2Q+FL._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX005"},
 {name:"Women Georgette Saree", price:699, old:1999, myCommission:10, cat:"womens", platform:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/sari/3/9/5/-original-imaghx9qng3xuhha.jpeg", link:"https://www.flipkart.com/womens-saree/p/itm003"},
 {name:"Women Western Top", price:399, old:999, myCommission:3, cat:"womens", platform:"amazon", img:"https://m.media-amazon.com/images/I/71e+4uY6+ZL._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX006"},
 {name:"Women Handbag Brown", price:599, old:1499, myCommission:10, cat:"womens", platform:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/hand-messenger-bag/e/a/9/-original-imaghx9qng3xuhha.jpeg", link:"https://www.flipkart.com/handbag/p/itm004"},
 {name:"Lipstick Matte Red 5pc Set", price:299, old:699, myCommission:10, cat:"makeup", platform:"amazon", img:"https://m.media-amazon.com/images/I/61+Qv2KhM5L._SL1500_.jpg", link:"https://www.amazon.in/dp/B0XXXX008"},
 {name:"Makeup Brush Set 12pc", price:349, old:799, myCommission:10, cat:"makeup", platform:"flipkart", img:"https://rukminim2.flixcart.com/image/612/612/xif0q/makeup-kit/3/9/5/-original-imaghx9qng3xuhha.jpeg", link:"https://www.flipkart.com/makeup-kit/p/itm007"},
];

function makeAffiliateLink(product){
  let amazonTagged = product.platform==='amazon'? product.link.split("?")[0] + `?tag=${MY_AMAZON_TAG}` : product.link;
  if(USE_CUELINK && CUELINK_PUBLISHER_ID!== "YAHAN_CUELINK_ID_LAGEGI_BAAD_ME" && CUELINK_PUBLISHER_ID!== ""){
    let encoded = encodeURIComponent(amazonTagged);
    return `https://links.cuelinks.com/c/${CUELINK_PUBLISHER_ID}?m=${product.platform}&url=${encoded}`;
  }
  if(product.platform==='amazon') return amazonTagged;
  if(product.platform==='flipkart') return product.link + (product.link.includes("?")?"&":"?") + `affid=${MY_FLIPKART_AFFID}`;
  return product.link;
}
function getFiltered(){ return currentFilter==='all'? allProducts : allProducts.filter(p=>p.cat===currentFilter); }
function renderProducts(){
  let filtered=getFiltered();
  let toShow=filtered.slice(0, visibleCount);
  document.getElementById("productContainer").innerHTML=`<div class="grid">`+toShow.map(p=>{
    let autoDisc=(p.myCommission*1)/100;
    let finalPrice=p.price-autoDisc-spinExtra;
    if(finalPrice < p.price-5) finalPrice=p.price-5;
    return `<div class="prod"><img src="${p.img}" loading="lazy"><h4>${p.name}</h4><div><span class="price">₹${finalPrice.toFixed(2)}</span><span class="old">₹${p.old}</span></div><span class="discTag">✓ ₹${autoDisc.toFixed(2)} Off Auto ${spinExtra>0?`+ ₹${spinExtra} Spin`:''}</span><button class="buy" onclick="buyProduct(${allProducts.indexOf(p)})">Get Offer - ${p.platform}</button></div>`;
  }).join('')+`</div>`;
  document.getElementById("loader").innerText=visibleCount<filtered.length?"↓ Scroll for more...":"✓ All products loaded";
}
function filterCat(cat, el){ currentFilter=cat; visibleCount=8; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderProducts(); }
window.addEventListener('scroll', ()=>{ if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 400){ if(visibleCount < getFiltered().length){ visibleCount+=4; renderProducts(); if(visibleCount % 8 === 0) showMonetag(); } } });
async function showMonetag(){ try{ if(typeof show_11968926==='function') await show_11968926(); }catch(e){} }
async function showAdsgram(){ try{ if(AdsBlock) await AdsBlock.show(); }catch(e){} }
function getSpinDiscount(){ let r=Math.random()*100; if(r<70) return {label:"Try Again", value:0}; if(r<98) return {label:"0% Extra", value:0}; if(r<98.5) return {label:"5% Extra", value:1}; if(r<99) return {label:"10% Extra", value:2}; if(r<99.5) return {label:"15% Extra", value:3}; return {label:"20% Extra", value:4}; }
async function startSpin(){ if(isSpinning) return; isSpinning=true; document.getElementById("spinBtn").innerText="Loading..."; document.getElementById("spinBtn").disabled=true; await showMonetag(); document.getElementById("wheel").style.transform=`rotate(${360*5+Math.random()*360}deg)`; setTimeout(async()=>{ let res=getSpinDiscount(); spinExtra=res.value; document.getElementById("result").innerHTML=res.value===0?`🎡 ${res.label}`:`🎉 ${res.label} + ₹${res.value} extra`; renderProducts(); document.getElementById("spinBtn").innerText="Spin and Get More Discount"; document.getElementById("spinBtn").disabled=false; isSpinning=false; await showAdsgram(); },4000); }
async function buyProduct(idx){ let p=allProducts[idx]; await showMonetag(); let finalLink=makeAffiliateLink(p); window.open(finalLink,"_blank"); }
renderProducts();
setInterval(async()=>{ if(isSpinning) return; if(lastAd==="adsgram"){await showMonetag(); lastAd="monetag";} else {await showAdsgram(); lastAd="adsgram";}},30000);
<!-- PDF COMPRESSOR WITH DOUBLE AD START -->
<div id="pdfTool" style="margin:16px 0;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px">
  <h3 style="color:#f8fafc;margin-bottom:8px">📄 PDF Compressor</h3>
  <p style="color:#94a3b8;font-size:12px;margin-bottom:10px">File safe hai, Telegram se bahar nahi jayegi</p>
  <input type="file" id="pdfInput" accept="application/pdf" style="width:100%;padding:10px;background:#0f172a;border:1px dashed #334155;border-radius:10px;color:#fff" />
  <button id="compressBtn" style="margin-top:12px;width:100%;background:#f59e0b;border:0;border-radius:10px;padding:12px;font-weight:800;color:#000">⚡ Compress Now</button>
  <div id="pdfStatus" style="margin-top:10px;color:#38bdf8;font-size:13px"></div>
  <button id="pdfDownload" style="display:none;margin-top:12px;width:100%;background:#38bdf8;border:0;border-radius:10px;padding:12px;font-weight:800">⬇️ Download Compressed PDF</button>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
// AD SETUP - tere IDs
const ADSGRAM_ID = "int-52779";
let AdsCtrl=null; try{ if(window.Adsgram) AdsCtrl = window.Adsgram.init({blockId: ADSGRAM_ID}); }catch(e){}

async function showMonetagAd(){
  return new Promise(async (resolve)=>{
    try{
      // Monetag zone 11968926 auto load hai
      // Rewarded / Interstitial show karne ka try
      if(window.show_11968926){ window.show_11968926(); setTimeout(resolve, 3500); }
      else if(window.monetag && window.monetag.show){ await window.monetag.show(); resolve(); }
      else { console.log('Monetag loading...'); setTimeout(resolve, 2500); } // fallback 2.5 sec ad time
    }catch(e){ resolve(); }
  });
}

async function showAdsgramAd(){
  try{ if(AdsCtrl) await AdsCtrl.show(); }catch(e){ console.log('Adsgram error',e); }
}

let compressedBytes = null;
let selectedFile = null;

document.getElementById('pdfInput').addEventListener('change', (e)=>{
  selectedFile = e.target.files[0];
  if(selectedFile) document.getElementById('pdfStatus').textContent = `Selected: ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(2)} MB)`;
});

document.getElementById('compressBtn').addEventListener('click', async ()=>{
  if(!selectedFile){ alert('Pehle PDF select karo'); return; }
  const status = document.getElementById('pdfStatus');
  const dlBtn = document.getElementById('pdfDownload');

  status.textContent = "⏳ Monetag Ad loading...";
  // 1. PEHLE MONETAG AD
  await showMonetagAd();

  status.textContent = "⚙️ Compressing PDF...";
  try{
    const arrayBuffer = await selectedFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    pdfDoc.setTitle(''); pdfDoc.setAuthor(''); pdfDoc.setSubject(''); pdfDoc.setProducer(''); pdfDoc.setCreator('');
    compressedBytes = await pdfDoc.save({ useObjectStreams: true });

    const oldSize = selectedFile.size/1024;
    const newSize = compressedBytes.length/1024;
    const saved = ((1 - newSize/oldSize)*100).toFixed(1);
    status.innerHTML = `✅ Compressed!<br>Old: ${oldSize.toFixed(0)} KB → New: ${newSize.toFixed(0)} KB (${saved}% saved)<br>⏳ Final ad...`;

    // 2. LAST MAI ADSGRAM AD
    await showAdsgramAd();

    status.innerHTML += `<br><b style="color:#22c55e">Ready to download!</b>`;
    dlBtn.style.display='block';

  }catch(err){ status.textContent = "Error: "+err.message; }
});

document.getElementById('pdfDownload').onclick = ()=>{
  if(!compressedBytes) return;
  const blob = new Blob([compressedBytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='compressed-tadka.pdf'; a.click();
};
</script>
<!-- PDF COMPRESSOR WITH DOUBLE AD END -->
</script>
</body>
</html>
