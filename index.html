<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel V32 - Auto Domain</title>
<style>
body{font-family:Arial;padding:15px;background:#111;color:#fff;margin:0}
.card{background:#222;padding:16px;border-radius:12px;margin-top:12px}
input,button{padding:12px;width:100%;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
button{background:#00c853;color:#fff;font-weight:bold;font-size:15px}
small{color:#aaa;font-size:11px}
#botInfo{color:#00ff88;font-size:12px}
</style>
</head>
<body>
<h2>🔐 Admin Panel V32 - Final</h2>
<p id="botInfo">Bot Loading...</p>
<p style="font-size:12px;color:#aaa">Domain Auto Detect: <span id="domainShow" style="color:#fff"></span></p>

<div class="card">
<h3>💰 1% Calculator + Approve</h3>
<input id="price" type="number" placeholder="Product Price (Ex: 26900)" oninput="calc()">
<input id="comm" type="number" placeholder="Amazon Commission % (Ex: 5)" oninput="calc()">
<p id="calc" style="color:#00ff88;font-size:13px"></p>
<hr>
<input id="userId" placeholder="User ka Telegram ID (jaise 8594115193)">
<input id="amount" type="number" placeholder="Customer ko dena hai (auto)" step="0.01">
<button onclick="approve()">✅ APPROVE & SEND TO USER</button>
<p id="res" style="font-size:12px"></p>
</div>

<div class="card">
<h3>🔗 Approval Link</h3>
<small>User ko ye link bhejo, kholte hi uska Pending -> Confirmed ho jayega. Domain auto hai.</small>
<p id="link" style="word-break:break-all;font-size:12px;background:#111;padding:10px;border-radius:8px;margin-top:8px"></p>
<button onclick="copyLink()">Copy Link</button>
</div>

<script>
const BOT_TOKEN="8960995263:AAFY3_4zGVsPMQHGlb9wDZt0OkJD_iIkXlc";
const ADMIN_CHAT_ID="8594115193";
let BOT_USERNAME="";

// Auto Domain Detect
let CURRENT_DOMAIN = window.location.origin;
let CURRENT_PATH = window.location.pathname;
let BASE_URL = CURRENT_DOMAIN + CURRENT_PATH.replace('admin.html','').replace('admin','');
if(BASE_URL.endsWith('/')) BASE_URL = BASE_URL.slice(0,-1);
if(BASE_URL === "") BASE_URL = CURRENT_DOMAIN;
document.getElementById('domainShow').innerText = BASE_URL || CURRENT_DOMAIN;

// Auto Bot Username Detect
fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`)
.then(r=>r.json())
.then(d=>{
  if(d.ok){
    BOT_USERNAME = d.result.username;
    document.getElementById('botInfo').innerText = `✅ Bot Connected: @${BOT_USERNAME} | Admin ID: ${ADMIN_CHAT_ID}`;
  }else{
    document.getElementById('botInfo').innerText = `❌ Bot Token Error`;
  }
});

function calc(){
  let p=parseFloat(document.getElementById('price').value)||0;
  let c=parseFloat(document.getElementById('comm').value)||0;
  let yourComm=p*c/100;
  let cust=yourComm*0.01;
  let profit=yourComm-cust;
  document.getElementById('calc').innerHTML=`Your Commission: <b>₹${yourComm.toFixed(2)}</b><br>Customer 1%: <b>₹${cust.toFixed(2)}</b><br>Your Profit: <b style="color:#00ff88">₹${profit.toFixed(2)}</b>`;
  document.getElementById('amount').value=cust.toFixed(2);
  genLink();
}
function genLink(){
  let amt=document.getElementById('amount').value||"1.00";
  let link = `${BASE_URL}/index.html?confirm=${amt}`;
  // Agar index.html nahi hai to root pe
  if(BASE_URL.includes('index.html')) link = `${BASE_URL.split('index.html')[0]}?confirm=${amt}`;
  else link = `${BASE_URL}/?confirm=${amt}`;
  // Double slash fix
  link = link.replace('//?','/?').replace('///','//');
  // Final clean link - agar aapki file ka naam index.html hai to ye sahi hai
  let finalLink = window.location.origin + "/?confirm=" + amt;
  // Agar aap GitHub Pages pe ho to /repo-name/ bhi include hoga
  let pathParts = window.location.pathname.split('/');
  if(pathParts.length > 2){
    // jaise /EarningTadka/index.html
    finalLink = window.location.origin + "/" + pathParts[1] + "/?confirm=" + amt;
    if(window.location.pathname.includes('admin.html')){
      finalLink = window.location.origin + window.location.pathname.replace('admin.html','') + "?confirm=" + amt;
    }
  }
  document.getElementById('link').innerText = finalLink;
  return finalLink;
}
function approve(){
  let uid=document.getElementById('userId').value.trim();
  let amt=document.getElementById('amount').value.trim();
  if(!uid||!amt){alert("User ID aur Amount dalo");return;}
  let link = genLink();
  let text = `🎉 *Cashback Confirmed!* (1% Model)\n\n💰 Amount: ₹${amt}\n✅ Order Confirm ho gaya, return nahi hua\n\n👉 Niche link pe click karo, wallet me paisa add ho jayega:\n${link}\n\nApp kholo aur Withdraw kar lo!`;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${uid}&text=${encodeURIComponent(text)}`)
 .then(r=>r.json()).then(d=>{
    if(d.ok){
      document.getElementById('res').innerHTML=`✅ <b>₹${amt}</b> ka approval @${uid} ko bhej diya!<br>Link: ${link}`;
    }else{
      document.getElementById('res').innerHTML=`❌ Telegram Error: ${d.description}<br><br>👉 User ne aapka Bot @${BOT_USERNAME} start nahi kiya hai. Isliye usko ye link manually bhejo:<br><b>${link}</b>`;
    }
  });
}
function copyLink(){
  let t=document.getElementById('link').innerText;
  navigator.clipboard.writeText(t).then(()=>{alert("Link Copied: "+t);});
}
// Initial link
setTimeout(genLink,500);
</script>
</body>
  </html>
