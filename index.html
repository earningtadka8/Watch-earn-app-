<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BestDeals & Shopping - Amazon Flipkart Offers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11968926' data-sdk='show_11968926'></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:10px}
.header{background:linear-gradient(90deg,#ff6a00,#ee0979);color:#fff;padding:15px;border-radius:12px;text-align:center;margin-bottom:12px}
.coins{background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.1);font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:140px;object-fit:cover}
.card-body{padding:8px}
.price{color:#e60000;font-weight:bold;font-size:15px}
.mrp{color:gray;text-decoration:line-through;font-size:11px}
.off{background:#00c853;color:#fff;padding:2px 5px;border-radius:4px;font-size:10px;margin-left:4px}
.btn{width:100%;background:#ff6a00;color:#fff;border:none;padding:9px;border-radius:6px;margin-top:6px;font-weight:bold;cursor:pointer}
.btn-flip{background:#047bd5}
.ad-btn{width:100%;background:linear-gradient(90deg,#00c853,#009624);color:#fff;border:none;padding:13px;border-radius:10px;margin:8px 0;font-weight:bold;font-size:14px;cursor:pointer}
.small{font-size:11px;color:gray;text-align:center}
</style>
</head>
<body>
<div class="header"><h2>🛍️ BestDeals & Shopping</h2><p>Amazon • Flipkart • Best Offers + Extra Coins</p></div>
<div class="coins"><div>💰 Coins: <b id="coinCount">0</b></div><div>👁️ Ads: <b id="adCount">0</b></div></div>
<button class="ad-btn" onclick="watchAdsgramAd()">▶️ Watch Ad & Earn 10 Coins (Adsgram)</button>
<button class="ad-btn" style="background:linear-gradient(90deg,#ff6a00,#ee0979)" onclick="watchMonetagAd()">▶️ Watch Ad & Earn 10 Coins (Monetag)</button>
<p class="small">Har ad se coins + har shopping se commission</p>
<h3 style="margin:12px 0">🔥 Trending Deals - Best Offers</h3>
<div class="products" id="productGrid">Loading Products...</div>

<script>
// ===== FINAL CONFIG - APPROVED TAGS =====
const AMAZON_TAG = "earningtadka-21";
const FLIPKART_AFFID = "earningtadka";
const ADSGRAM_BLOCK_ID = "int-52390";
const BOT_ID = "8960995263";

// Coins System
let coins = parseInt(localStorage.getItem('coins')||'0');
let adsWatched = parseInt(localStorage.getItem('adsWatched')||'0');
document.getElementById('coinCount').innerText = coins;
document.getElementById('adCount').innerText = adsWatched;
function addReward(c=10){ coins+=c; adsWatched+=1; localStorage.setItem('coins',coins); localStorage.setItem('adsWatched',adsWatched); document.getElementById('coinCount').innerText=coins; document.getElementById('adCount').innerText=adsWatched; alert("✅ "+c+" Coins Added! Total: "+coins); }

// ===== MONETAG =====
function watchMonetagAd(){ if(typeof show_11968926==='function'){ show_11968926().then(()=>{ addReward(10); }).catch(()=>alert("Monetag Ad not ready, try again")) } else alert("Monetag loading...") }
// Auto In-App Interstitial (every 30 sec, 2 ads per 6 min)
if(typeof show_11968926==='function'){ show_11968926({type:'inApp',inAppSettings:{frequency:2,capping:0.1,interval:30,timeout:5,everyPage:false}}) }

// ===== ADSGRAM =====
let AdController = null;
try{ if(window.Adsgram){ AdController = Adsgram.init({blockId:ADSGRAM_BLOCK_ID}); } }catch(e){ console.log(e) }
function watchAdsgramAd(){ if(AdController){ AdController.show().then((res)=>{ if(res.done || res.state==='completed') addReward(10); }).catch(()=>alert("Adsgram Ad not ready")) } else alert("Adsgram loading...") }

// ===== PRODUCTS WITH AUTO COMMISSION TAG =====
const products=[
{title:"Wireless Bluetooth Earbuds Pro",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400",price:799,mrp:2999,off:"73% OFF",platform:"amazon",link:"https://www.amazon.in/s?k=bluetooth+earbuds"},
{title:"Smart Watch Series 8 Ultra",img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",price:1999,mrp:5999,off:"66% OFF",platform:"flipkart",link:"https://www.flipkart.com/search?q=smart+watch"},
{title:"Men's Sneakers Running Shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",price:999,mrp:2499,off:"60% OFF",platform:"amazon",link:"https://www.amazon.in/s?k=sneakers+for+men"},
{title:"Women Kurta Set Festive",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400",price:599,mrp:1999,off:"70% OFF",platform:"flipkart",link:"https://www.flipkart.com/search?q=women+kurta+set"},
{title:"20000mAh Power Bank Fast Charge",img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400",price:1299,mrp:3499,off:"62% OFF",platform:"amazon",link:"https://www.amazon.in/s?k=power+bank+20000mah"},
{title:"RGB Gaming Headphones Mic",img:"https://images.unsplash.com/photo-1599669454699-248893623440?w=400",price:1499,mrp:3999,off:"62% OFF",platform:"flipkart",link:"https://www.flipkart.com/search?q=gaming+headphone"},
{title:"4K Action Camera Waterproof",img:"https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400",price:2499,mrp:7999,off:"68% OFF",platform:"amazon",link:"https://www.amazon.in/s?k=action+camera"},
{title:"Designer Backpack for College",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",price:799,mrp:1999,off:"60% OFF",platform:"flipkart",link:"https://www.flipkart.com/search?q=backpack"},
];

function getAffiliateLink(p){
  let url = p.link;
  if(p.platform==="amazon"){
    url += (url.includes("?")?"&":"?")+"tag="+AMAZON_TAG;
  } else {
    url += (url.includes("?")?"&":"?")+"affid="+FLIPKART_AFFID;
  }
  return url;
}

function renderProducts(){
  const grid=document.getElementById("productGrid");
  grid.innerHTML="";
  products.forEach(p=>{
    let aff = getAffiliateLink(p);
    grid.innerHTML+=`<div class="card"><img src="${p.img}"><div class="card-body"><div style="font-size:12px;font-weight:bold;height:32px;overflow:hidden">${p.title}</div><div style="margin:4px 0"><span class="price">₹${p.price}</span> <span class="mrp">₹${p.mrp}</span> <span class="off">${p.off}</span></div><div style="font-size:10px;color:${p.platform==='amazon'?'#ff6a00':'#047bd5'}">🔹 ${p.platform.toUpperCase()} • Commission: ON</div><button class="btn ${p.platform==='flipkart'?'btn-flip':''}" onclick="buyProduct('${aff}')">Buy on ${p.platform==='amazon'?'Amazon':'Flipkart'}</button></div></div>`;
  });
}

function buyProduct(link){
  // Show small in-app ad before redirect for extra earning
  try{ if(typeof show_11968926==='function'){ show_11968926({type:'inApp',inAppSettings:{frequency:1,capping:0.1,interval:1,timeout:1,everyPage:false}}) } }catch(e){}
  setTimeout(()=>{
    window.open(link,"_blank");
    if(window.Telegram && window.Telegram.WebApp){ Telegram.WebApp.openLink(link); }
  },600);
}
renderProducts();
</script>
</body>
</html>
