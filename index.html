<style>
body{font-family:Arial;background:#f2f2f2;padding:10px;margin:0;padding-bottom:90px}
.header{background:#111;color:#fff;padding:16px;border-radius:16px;text-align:center}
.wallet{background:#fff;border:2px solid #00c853;border-radius:16px;padding:12px;margin-top:12px}
.wallet-row{display:flex;justify-content:space-between;margin:6px 0;font-size:13px}
.wallet-bal{font-size:22px;font-weight:bold;color:#00c853}
.pending-bal{font-size:16px;font-weight:bold;color:#ff9800}
.withdraw-btn{background:#00c853;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:bold}
.withdraw-btn.locked{background:#ccc;color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.product{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.product img{width:100%;height:140px;object-fit:cover;border-radius:10px}
.cashback{background:#e8f5e9;color:#1b5e20;border:1px dashed #2e7d32;padding:4px 6px;border-radius:6px;font-size:10px;font-weight:bold;margin-top:6px;display:inline-block}
.btn{padding:10px;border-radius:10px;color:#fff;font-weight:bold;font-size:11px;width:100%;border:none;margin-top:8px}
.btn.amazon{background:#ff9900}.btn.flipkart{background:#2874f0}
#adStatus{position:fixed;top:10px;right:10px;background:#000;color:#00ff88;padding:8px 14px;border-radius:20px;font-size:10px;z-index:100000;border:1px solid #00ff88;font-weight:bold;max-width:180px}
#openOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:20px}
.start-btn{background:linear-gradient(90deg,#00ff88,#00c853);color:#000;border:none;padding:18px 40px;border-radius:16px;font-weight:bold;font-size:20px;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
#debug{font-size:10px;color:#aaa;margin-top:12px;background:#222;padding:8px;border-radius:8px;max-width:300px;word-break:break-all}
</style>

<body>
<div id="adStatus">Waiting for Start</div>
<div class="header"><h3>🛍️ BestDealsandshop</h3><p style="font-size:10px;background:#00ff88;color:#000;padding:4px 12px;border-radius:20px;display:inline-block;margin:6px 0 0;font-weight:bold">V75 - Tap to Start Fix</p></div>

<!-- APP OPEN OVERLAY - Yahi se ad start hoga -->
<div id="openOverlay">
<h2 style="font-size:28px">🎁 Welcome!</h2>
<p style="color:#aaa;margin-top:10px">Tap to start shopping<br>First ad will play</p>
<button class="start-btn" onclick="startApp()">👆 TAP TO START</button>
<div id="debug">Loading SDKs...<br>Monetag: checking...<br>OnClickA: checking...</div>
<p style="font-size:10px;color:#666;margin-top:16px">Telegram needs 1 tap to allow ads</p>
</div>

<div class="wallet">
<div class="wallet-row"><span>✅ Confirmed</span><span class="wallet-bal" id="walletBal">₹0.00</span></div>
<div class="wallet-row"><span>⏳ Pending</span><span class="pending-bal" id="pendingBal">₹0.00</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
<span style="font-size:10px;color:#888">Min ₹50</span>
<button id="withdrawBtn" class="withdraw-btn locked" onclick="withdrawCash()">🔒 Locked</button>
</div>
</div>

<div class="grid" id="grid"></div>

<script>
const AMAZON_TAG="earningtadka8-21"; const FLIPKART_AFFID="earningtadka"; const BOT_TOKEN="8960995263:AAFY3_4zGVsPMQHGlb9wDZt0OkJD_iIkXlc"; const ADMIN_CHAT_ID="8594115193";

const PRODUCTS=[
{name:"Apple AirPods Pro 2nd",img:"https://m.media-amazon.com/images/I/61SUj2aKoEL._SL1500_.jpg",kw:"apple airpods pro 2nd gen",price:26900,comm:5,store:"amazon"},
{name:"Sony WH-1000XM5",img:"https://m.media-amazon.com/images/I/51aXvjzcukL._SL1080_.jpg",kw:"sony wh 1000xm5",price:29990,comm:5,store:"amazon"},
{name:"Nike Air Jordan Shoes",img:"https://m.media-amazon.com/images/I/71E75yRwCDL._SL1500_.jpg",kw:"nike air shoes men",price:4500,comm:10,store:"amazon"},
{name:"Fastrack Limitless Watch",img:"https://m.media-amazon.com/images/I/61akt30bJsL._SL1080_.jpg",kw:"fastrack smartwatch",price:2995,comm:8,store:"amazon"},
{name:"Levi's 511 Slim Jeans",img:"https://m.media-amazon.com/images/I/71r7F2R+8JL._SL1500_.jpg",kw:"levis jeans men",price:2499,comm:10,store:"amazon"},
{name:"Safari 30L Backpack",img:"https://m.media-amazon.com/images/I/81KEKEDFUcL._SL1500_.jpg",kw:"safari backpack 30L",price:1599,comm:10,store:"amazon"},
{name:"Puma Oversized T-Shirt",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/t-shirt/b/0/3/m-oversized-tshirt-one8-original-imahfcf7e8cwxyvz.jpeg",kw:"puma oversized tshirt men",price:599,comm:10,store:"flipkart"},
{name:"Adidas Running Shoes",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/shoe/1/8/5/8-adidas-ftwwht-cblack-original-imah8pdnqzmdyzyh.jpeg",kw:"adidas running shoes men",price:2999,comm:12,store:"flipkart"},
{name:"Boat Rockerz 550",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/headphone/b/s/q/-original-imah8pdnxdwzaz3q.jpeg",kw:"boat rockerz 550 headphone",price:1999,comm:10,store:"flipkart"},
{name:"Wildcraft 44L Backpack",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/backpack/1/o/3/-original-imah8hzyzhegzfzz.jpeg",kw:"wildcraft backpack 44L",price:1899,comm:12,store:"flipkart"},
{name:"Levi's T-Shirt Combo",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/t-shirt/e/r/6/l-1-levis-t-shirt-original-imah8hzyzgzgfzzg.jpeg",kw:"levis tshirt men combo",price:999,comm:10,store:"flipkart"},
{name:"Fastrack Analog Watch",img:"https://rukminim2.flixcart.com/image/832/832/xif0q/watch/8/8/5/-original-imah8hzyzgzgfzzg.jpeg",kw:"fastrack analog watch men",price:2495,comm:8,store:"flipkart"}
];

let wallet=parseFloat(localStorage.getItem('walletBal')||'0'); let pending=parseFloat(localStorage.getItem('pendingBal')||'0');
function updateWallet(){document.getElementById('walletBal').innerText='₹'+wallet.toFixed(2); document.getElementById('pendingBal').innerText='₹'+pending.toFixed(2); localStorage.setItem('walletBal',wallet); localStorage.setItem('pendingBal',pending); let w=document.getElementById('withdrawBtn'); if(wallet>=50){w.innerText="Withdraw"; w.classList.remove('locked');} else {w.innerText=`🔒 Locked (₹${wallet.toFixed(2)}/₹50)`; w.classList.add('locked');}}
function getCashback(p,c){return (p*c/100)*1/100;}
function getAffUrl(pr){if(pr.store==='flipkart') return `https://dl.flipkart.com/dl/search?q=${encodeURIComponent(pr.kw)}&affid=${FLIPKART_AFFID}`; else return `https://www.amazon.in/s?k=${encodeURIComponent(pr.kw)}&tag=${AMAZON_TAG}`;}
function renderProducts(){let h=""; PRODUCTS.forEach(pr=>{let cb=getCashback(pr.price,pr.comm); let c=pr.store==='flipkart'?'btn flipkart':'btn amazon'; h+=`<div class="product"><img src="${pr.img}"><p style="font-size:12px;font-weight:bold;margin:8px 0 2px;height:38px;overflow:hidden">${pr.name}<br><span style="font-size:10px;color:#666">₹${pr.price}</span></p><div class="cashback">₹${cb.toFixed(2)} Cashback</div><button class="${c}" onclick="buyProduct('${pr.name}',${pr.price},${pr.comm},${cb.toFixed(2)},'${pr.store}','${encodeURIComponent(pr.kw)}')">Buy ${pr.store.toUpperCase()}</button></div>`;}); document.getElementById('grid').innerHTML=h;}
function buyProduct(n,p,c,cb,s,k){let kw=decodeURIComponent(k); let u=getAffUrl({kw:kw,store:s}); pending+=parseFloat(cb); updateWallet(); if(window.Telegram && Telegram.WebApp){Telegram.WebApp.openLink(u);} else {window.open(u,'_blank');}}
function withdrawCash(){if(wallet<50){alert(`Min ₹50`);return;} let upi=prompt(`UPI:`); if(upi && upi.includes('@')){let a=wallet; wallet=0; updateWallet(); fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_CHAT_ID}&text=${encodeURIComponent(`WITHDRAW V75 ₹${a} ${upi}`)}`); alert(`Sent ₹${a}`);}}

// ===== FIX: APP OPEN AD ONLY AFTER USER TAP =====
let isAdPlaying=false;
let adCounter=0;
let timerId=null;

function playMonetag(){
  return new Promise(resolve=>{
    document.getElementById('debug').innerText += '\nTrying Monetag show_11968926...';
    if(typeof show_11968926==='function'){
      show_11968926().then(()=>{ console.log('Monetag Played'); document.getElementById('debug').innerText+='\n✅ Monetag Played'; resolve('monetag'); })
      .catch(e=>{
        document.getElementById('debug').innerText+='\n❌ Monetag Fail: '+e+' -> OnClickA try';
        if(window.showOnclicka){ window.showOnclicka().then(()=>resolve('fallback')).catch(()=>resolve('fail')); }
        else resolve('fail');
      });
    } else {
      document.getElementById('debug').innerText+='\n❌ Monetag not loaded, trying OnClickA';
      if(window.showOnclicka){ window.showOnclicka().then(()=>resolve('onclicka')).catch(()=>resolve('fail')); }
      else resolve('fail');
    }
  });
}

function playOnclicka(){
  return new Promise(resolve=>{
    document.getElementById('debug').innerText += '\nTrying OnClickA...';
    if(window.showOnclicka){
      window.showOnclicka().then(()=>{ console.log('OnClickA Played'); document.getElementById('debug').innerText+='\n✅ OnClickA Played'; resolve('onclicka'); })
      .catch(e=>{
        document.getElementById('debug').innerText+='\n❌ OnClickA Fail: '+e+' -> Monetag try';
        if(typeof show_11968926==='function'){ show_11968926().then(()=>resolve('fallback')).catch(()=>resolve('fail')); }
        else resolve('fail');
      });
    } else {
      document.getElementById('debug').innerText+='\n❌ OnClickA not ready';
      if(typeof show_11968926==='function'){ show_11968926().then(()=>resolve('monetag')).catch(()=>resolve('fail')); }
      else resolve('fail');
    }
  });
}

async function startApp(){
  document.getElementById('openOverlay').style.display='none';
  document.getElementById('adStatus').innerText='App Open Ad Playing...';
  isAdPlaying=true;
  adCounter=1;
  
  // Pehla ad - Monetag
  let res = await playMonetag();
  isAdPlaying=false;
  document.getElementById('adStatus').innerText=`Open Ad ${res} Done #1 | OnClickA in 30s`;
  
  // 30 sec timer - OnClickA
  scheduleNext('onclicka');
}

function scheduleNext(nextType){
  if(timerId) clearInterval(timerId);
  let sec=30;
  timerId=setInterval(async ()=>{
    sec--;
    document.getElementById('adStatus').innerText=`Next: ${nextType.toUpperCase()} in ${sec}s | Done: ${adCounter}`;
    if(sec<=0){
      clearInterval(timerId);
      if(isAdPlaying) return; // collision check
      isAdPlaying=true;
      adCounter++;
      document.getElementById('adStatus').innerText=`${nextType.toUpperCase()} Playing... #${adCounter}`;
      
      let res;
      if(nextType==='monetag') res = await playMonetag();
      else res = await playOnclicka();
      
      isAdPlaying=false;
      let following = nextType==='monetag' ? 'onclicka' : 'monetag';
      document.getElementById('adStatus').innerText=`${nextType.toUpperCase()} Done #${adCounter} | ${following.toUpperCase()} in 30s`;
      scheduleNext(following); // alternate
    }
  },1000);
}

// Debug SDK load check
setTimeout(()=>{
  let m = typeof show_11968926==='function' ? 'Ready ✅' : 'Not Loaded ❌ - Monetag dashboard me Telegram Mini App zone banao';
  let o = window.showOnclicka ? 'Ready ✅' : 'Loading...';
  document.getElementById('debug').innerText = `SDK Status:\nMonetag 11968926: ${m}\nOnClickA 11968926: ${o}\n\nTelegram WebView: ${window.Telegram?'Yes':'No'}\nTap START to play ad`;
},2000);

Telegram.WebApp.ready();
renderProducts();
updateWallet();
</script>
</body>
</html>
