<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn Pro</title>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="//libtl.com/sdk.js" data-zone="11955115" data-sdk="show_11955115"></script>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0;padding:15px}
.card{background:white;padding:20px;border-radius:15px;margin-bottom:15px}
button{padding:15px;width:100%;border:none;border-radius:10px;background:#00a8ff;color:white;font-size:18px;margin-top:10px}
.shop{display:flex;gap:10px}
.shop a{flex:1;padding:12px;background:#ff9900;color:white;text-decoration:none;border-radius:8px}
.shop a.flip{background:#2874f0}
.timer{color:red;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>💰 Watch & Earn</h2>
<h1 id="balance">$0.000</h1>
<p>Today: <span id="todayAds">0</span>/165 Ads | Hours: <span id="hours">0</span>/10</p>
<p>This Hour: <span id="hourAds">0</span>/<span id="hourLimit">30</span> Ads</p>
<p class="timer" id="timer"></p>
<button id="adBtn" onclick="watchAds()">▶️ Watch Ad & Earn</button>
</div>
<div class="card">
<h3>🛒 Shop & Earn Extra</h3>
<div class="shop">
<a href="https://www.amazon.in" target="_blank">Amazon</a>
<a class="flip" href="https://www.flipkart.com" target="_blank">Flipkart</a>
</div>
</div>
<script>
let data = JSON.parse(localStorage.getItem('earnData') || '{}');
let today = new Date().toDateString();
if(data.date !== today){
  data = {date:today, balance: data.balance||0, totalHours:0, hourStart:Date.now(), hourAds:0, todayAds:0, isFirstHour:true};
}
let balance = data.balance || 0;
let clickNumber = 0;
function save(){ localStorage.setItem('earnData', JSON.stringify(data)); }
function updateUI(){
  let hourLimit = data.isFirstHour ? 30 : 15;
  document.getElementById('balance').innerText = "$"+balance.toFixed(3);
  document.getElementById('todayAds').innerText = data.todayAds;
  document.getElementById('hours').innerText = data.totalHours;
  document.getElementById('hourAds').innerText = data.hourAds;
  document.getElementById('hourLimit').innerText = hourLimit;
  let timeLeft = 3600000 - (Date.now() - data.hourStart);
  if(data.todayAds >= 165 || data.totalHours >=10){
    document.getElementById('timer').innerText = "✅ Today's limit over. Come tomorrow!";
    document.getElementById('adBtn').disabled=true;
  } else if(data.hourAds >= hourLimit){
    document.getElementById('adBtn').disabled=true;
    let m = Math.floor(timeLeft/60000); let s = Math.floor((timeLeft%60000)/1000);
    document.getElementById('timer').innerText = `Next hour in: ${m}m ${s}s - After that 15 ads`;
    setTimeout(updateUI,1000);
  } else {
    document.getElementById('timer').innerText = `You can watch ${hourLimit - data.hourAds} more ads this hour`;
    document.getElementById('adBtn').disabled=false;
  }
}
setInterval(()=>{
  if(Date.now() - data.hourStart >= 3600000 && data.hourAds>0){
    data.totalHours++; data.hourAds=0; data.hourStart=Date.now(); data.isFirstHour=false;
    save(); updateUI();
  }
},1000);
function giveReward(){
  balance+=0.001; data.balance=balance; data.hourAds++; data.todayAds++; save(); updateUI(); alert('✅ $0.001 Added!');
}
function watchAds(){
  let hourLimit = data.isFirstHour ? 30 : 15;
  if(data.hourAds >= hourLimit || data.todayAds>=165) return;
  clickNumber++;
  if(clickNumber%2==1){
    const AdController = window.Adsgram.init({ blockId: "51933" });
    AdController.show().then(r=>{ if(r.done) giveReward(); }).catch(()=>{ showMonetag(); });
  } else { showMonetag(); }
}
function showMonetag(){ show_11955115().then(()=>{ giveReward(); }).catch(()=>{ alert('No ad, try again'); }); }
updateUI();
</script>
</body>
</html>
