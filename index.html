<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ads & Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="//libtl.com/sdk.js" data-zone="APNA_MONETAG_ZONE_ID_YAHAN" data-sdk="show_9697000"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
button{width:100%;padding:15px;background:#38bdf8;color:black;font-weight:bold;border:none;border-radius:10px;font-size:18px}
#count{color:#94a3b8;margin:10px}
</style>
</head>
<body>
<h2>💰 Watch & Earn</h2>
<div class="card">
<h1 id="balance">$0.000</h1>
<p id="count">Today: 0 / 20 Ads</p>
<button onclick="watchAds()" id="btn">Watch 2 Ads & Earn $0.001</button>
<p style="font-size:12px;color:#64748b;margin-top:10px">2 ads complete karne par reward milega</p>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
let today = new Date().toDateString();
let watched = parseInt(localStorage.getItem("watched_"+today) || "0");
let balance = parseFloat(localStorage.getItem("balance") || "0");

document.getElementById("balance").innerText = "$" + balance.toFixed(3);
document.getElementById("count").innerText = `Today: ${watched} / 20 Ads`;
if(watched>=20){ document.getElementById("btn").innerText="Limit Over - Kal Aana"; document.getElementById("btn").disabled=true; }

const AdController = window.Adsgram.init({ blockId: "APNA_ADSGRAM_BLOCK_ID" });

async function watchAds(){
 if(watched>=20){ alert("Aaj ka 20 ads ka quota pura ho gaya!"); return; }
 document.getElementById("btn").innerText = "Loading Ad 1/2...";
 try{
   // AD 1 - Telegram Ad
   await AdController.show();
   document.getElementById("btn").innerText = "Loading Ad 2/2...";
   // AD 2 - Monetag Ad
   await show_9697000(); // Monetag Rewarded function
   
   // Dono Ads Complete hone ke baad hi reward
   watched++;
   balance += 0.001;
   localStorage.setItem("watched_"+today, watched);
   localStorage.setItem("balance", balance);
   document.getElementById("balance").innerText = "$" + balance.toFixed(3);
   document.getElementById("count").innerText = `Today: ${watched} / 20 Ads`;
   document.getElementById("btn").innerText = "Watch 2 Ads & Earn $0.001";
   alert("Congrats! $0.001 added. Total: $" + balance.toFixed(3));
   if(watched>=20){ document.getElementById("btn").innerText="Limit Over"; document.getElementById("btn").disabled=true; }
 }catch(e){
   document.getElementById("btn").innerText = "Watch 2 Ads & Earn $0.001";
   console.log(e);
 }
}
</script>
</body>
</html>
